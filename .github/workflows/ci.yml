name: Validate and build design system
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm run build
      - run: npm run check:build
      - uses: actions/upload-artifact@v4
        with:
          name: huitou-design-system
          path: dist
          include-hidden-files: true
