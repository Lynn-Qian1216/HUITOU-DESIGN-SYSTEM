<!-- @dsCard group="控制台" viewport="1440x900" name="HUITOU 控制台" subtitle="对话优先的 AI 投手工作台 —— 会话、账户概览、AI 决策、广告投放" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><title>HUITOU 控制台</title><link rel="stylesheet" href="../../styles.css">
<link rel="stylesheet" href="auth.css">
<script src="../../node_modules/react/umd/react.development.js"></script>
<script src="../../node_modules/react-dom/umd/react-dom.development.js"></script>
<script src="../../node_modules/@babel/standalone/babel.min.js"></script>
<script src="../../_ds_bundle.js"></script>
<script src="data.js"></script>
<style>html,body,#root{height:100%;margin:0}
@keyframes huitouFlash{0%{background:var(--surface-page)}18%{background:var(--neutral-200)}100%{background:var(--surface-page)}}
.huitou-flash{animation:huitouFlash 900ms var(--ease-standard) 1}
@keyframes huitouPulseRow{0%{background:transparent}10%{background:var(--status-warning-bg)}70%{background:var(--status-warning-bg)}100%{background:transparent}}
.huitou-focus-row{animation:huitouPulseRow 3.6s var(--ease-standard) 1;box-shadow:inset 0 0 0 2px var(--status-warning-border)}
@keyframes huitouPulseCard{0%,100%{outline-offset:3px;background:var(--status-warning-bg)}50%{outline-offset:6px;background:transparent}}
.huitou-focus-card{outline:2px solid var(--status-warning-fg);outline-offset:3px;border-radius:var(--radius-md);animation:huitouPulseCard 1.2s var(--ease-standard) 2}
/* 控制台整体降一档字号：正文封顶 14，多数 12，最小 11。
   不改设计系统 token 本身（营销页仍按原尺度），只在控制台根上重映射。 */
#root{--fs-30:22px;--fs-24:18px;--fs-20:16px;--fs-18:15px;--fs-16:14px;--fs-14:13px;--fs-13:12px;--fs-12:11px;--fs-11:11px;
--type-h2-size:20px;--type-h3-size:16px;--type-h4-size:14px;--type-body-size:13px;--type-body-lg-size:14px;--type-label-size:12px;--type-caption-size:11px;--type-overline-size:11px;--type-metric-size:22px;--type-code-size:12px;font-size:13px}
@media(max-width:900px){.auth-brand{display:none!important}}@media(min-width:901px){.auth-mark{display:none!important}}
</style></head>
<body><div id="root"></div>
<script type="text/babel" src="SplashScreen.jsx"></script>
<script type="text/babel" src="AuthScreen.jsx"></script>
<script type="text/babel" src="ConsoleHint.jsx"></script>
<script type="text/babel" src="PlatformMark.jsx"></script>
<script type="text/babel" src="Shared.jsx"></script>
<script type="text/babel" src="TeamStore.jsx"></script>
<script type="text/babel" src="AppShell.jsx"></script>
<script type="text/babel" src="ReplyLoading.jsx"></script>
<script type="text/babel" src="ReplyBlocks.jsx"></script>
<script type="text/babel" src="MatrixChat.jsx"></script>
<script type="text/babel" src="MatrixCreative.jsx"></script>
<script type="text/babel" src="ChatScreen.jsx"></script>
<script type="text/babel" src="TeamView.jsx"></script>
<script type="text/babel" src="ConnectAccount.jsx"></script>
<script type="text/babel" src="TodosView.jsx" data-presets="react"></script>
<script type="text/babel" src="DashboardView.jsx" data-presets="react"></script>
<script type="text/babel" src="PlansView.jsx"></script>
<script type="text/babel" src="ProfileSettings.jsx"></script>
<script type="text/babel" src="LibraryView.jsx"></script>
<script type="text/babel" src="SystemSettings.jsx"></script>
<script type="text/babel" src="SettingsHub.jsx"></script>
<script type="text/babel" src="WorkspaceScreen.jsx"></script>
<script type="text/babel" src="OverviewScreen.jsx"></script>
<script type="text/babel" src="DiagnosisScreen.jsx"></script>
<script type="text/babel" src="StrategyScreen.jsx"></script>
<script type="text/babel" src="TeamScreen.jsx"></script>
<script type="text/babel" src="CampaignsScreen.jsx"></script>
<script type="text/babel" src="TencentCampaignsScreen.jsx"></script>
<script type="text/babel" src="CreatorsScreen.jsx"></script>
<script type="text/babel" src="ProductsScreen.jsx"></script>
<script type="text/babel" src="CreativesScreen.jsx"></script>
<script type="text/babel" src="ComponentsScreen.jsx"></script>
<script type="text/babel" src="AudiencesScreen.jsx"></script>
<script type="text/babel" src="MatrixData.jsx"></script>
<script type="text/babel" src="MatrixSteps.jsx"></script>
<script type="text/babel" src="MatrixPlan.jsx"></script>
<script type="text/babel" src="MatrixBatches.jsx"></script>
<script type="text/babel" src="MatrixScreen.jsx"></script>
<script type="text/babel" src="SettingsScreen.jsx"></script>
<script type="text/babel" src="DeliverySettings.jsx"></script>
<script type="text/babel" src="DecisionGraph.jsx"></script>
<script type="text/babel" src="DecisionDetail.jsx"></script>
<script type="text/babel" src="StrategyConfig.jsx"></script>
<script type="text/babel" src="DecisionsScreen.jsx"></script>
<script type="text/babel" data-presets="react">
(() => {
const { Toast } = window.HUITOUAIDesignSystem_52606d;
const TITLES = {'ai-1':'AI决策','overview':'账户概览','team':'AI团队','campaigns':'广告投放','creators':'达人','products':'商品库','settings':'投放设置','creatives':'创意','components':'组件','audiences':'人群包','matrix':'投放矩阵'};
const { Tabs } = window.HUITOUAIDesignSystem_52606d;
function DetailBody({children,flash,lit}){return <div className={'huitou-scroll'+(lit?' huitou-flash':'')} data-flash={flash} style={{flex:1,minHeight:0,minWidth:0,overflowY:'auto',padding:'var(--space-8)'}}>{children}</div>;}
function SettingsPage({sidebarOpen,onToggleSidebar}){
  return <><PaneHeader title="投放设置" sidebarOpen={sidebarOpen} onToggleSidebar={onToggleSidebar}/><DetailBody><DeliverySettings/></DetailBody></>;
}
function App(){
  const [splash,setSplash]=React.useState(true);
  const [authed,setAuthed]=React.useState(false);
  React.useEffect(()=>{window.HUITOU_LOGOUT=()=>setAuthed(false);},[]);
  const [tab,setTab]=React.useState('workspace');
  const [wsView,setWsView]=React.useState('home');
  const [rail,setRail]=React.useState(null);
  /* 全局跳转：{tab,view,rail}。通知等处只说「去哪」，路由细节留在这里一处。 */
  /* 落点闪烁：序号自增，连点两条同落点的通知也能重新触发动画 */
  const [flash,setFlash]=React.useState(null);
  React.useEffect(()=>{if(!flash)return;const t=setTimeout(()=>setFlash(null),950);return()=>clearTimeout(t);},[flash]);
  const go=React.useCallback((d)=>{if(!d)return;if(d.tab)setTab(d.tab);if(d.view)setWsView(d.view);if(d.rail){setPage('chat');setRail(d.rail);}const k=d.rail||d.view;if(k){setFlash(null);requestAnimationFrame(()=>setFlash({key:k,n:Date.now()}));}
    if(d.focus&&window.setFocus){window.setFocus(null);setTimeout(()=>window.setFocus(d.focus),160);}},[]);
  React.useEffect(()=>{window.HUITOU_GO=go;},[go]);
  const [platform,setPlatform]=React.useState('腾讯营销');
  const [account,setAccount]=React.useState(null);
  const [page,setPage]=React.useState('chat');   // chat | settings：侧栏级页面
  const [chat,setChat]=React.useState(null);
  const [session,setSession]=React.useState(0);   // 新建会话时递增，用于重挂会话区
  const [toast,setToast]=React.useState(false);
  React.useEffect(()=>{if(toast){const t=setTimeout(()=>setToast(false),4000);return()=>clearTimeout(t)}},[toast]);
  /* 从工作台点进某个账户：平台、账户、图标栏一起切过去。
     工作台两处传来的 platform 字段不同（列表是 id，提醒卡是中文名），这里统一成中文名。 */
  const openAccount=(acc)=>{
    const p=acc&&/tencent|腾讯/.test(acc.platform||'')?'腾讯营销':'巨量千川';
    setPlatform(p);
    if(acc) setAccount({platform:p,name:acc.name,account:acc.account||'',tag:acc.tag||''});
    setRail(null);
    setPage('chat');
    setTab('ads');
  };
  React.useEffect(()=>{window.HUITOU_OPEN_RAIL=(id)=>setRail(id);});
  const panes={
    'ai-1':<DecisionsScreen onToast={()=>setToast(true)}/>,
    'overview':<OverviewScreen platform={platform} account={account&&account.name} onNavigate={()=>setRail('ai-1')}/>,
    'team':<TeamScreen/>,
    'campaigns':platform==='腾讯营销'?<TencentCampaignsScreen/>:<CampaignsScreen/>,
    'creators':<CreatorsScreen/>,
    'products':<ProductsScreen/>,
    'settings':<DeliverySettings/>,
    'creatives':<CreativesScreen/>,
    'components':<ComponentsScreen/>,
    'audiences':<AudiencesScreen/>,
    'matrix':<MatrixScreen/>,
  };
    const splashNode = splash ? <SplashScreen onDone={()=>setSplash(false)}/> : null;
  if(!authed) return <>{splashNode}<div style={{height:'100%',opacity:splash?0:1,transition:'opacity 320ms var(--ease-standard)'}}><AuthScreen onDone={()=>setAuthed(true)}/></div></>;
  const shellStyle = {height:'100%',opacity:splash?0:1,transition:'opacity 320ms var(--ease-standard)'};
  if(tab==='workspace') return <>{splashNode}<div style={shellStyle}><AppShell plain tab={tab} onTab={setTab} onGo={go}><WorkspaceScreen view={wsView} onView={setWsView} onOpenAccount={openAccount} lit={flash&&flash.key===wsView?flash.n:null}/></AppShell></div></>;
  return <>
    {splashNode}
    <div style={shellStyle}>
    <AppShell tab={tab} onTab={setTab} onGo={go} rail={rail} onRail={(id)=>setRail(id===rail?null:id)} hideRail={page==='settings'} chat={chat} onChat={(id)=>{setChat(id);setSession(s=>s+1);setPage('chat');}}
      platform={platform} account={account} onPlatform={(p,acc)=>{setPlatform(p);setAccount(acc);if(p!==platform)setRail(null);}}
      onGoAccounts={()=>{setWsView('accounts');setTab('workspace');}}
      onGoSettings={()=>{setPage('settings');setRail(null);}}
      onGoWorkspace={(v)=>{setWsView(v);setTab('workspace');}}
      detail={page==='chat'&&rail?<><DetailHeader title={TITLES[rail]} onClose={()=>setRail(null)}/><DetailBody flash={rail} lit={flash&&flash.key===rail?flash.n:null}>{panes[rail]}</DetailBody></>:null}>
      {page==='settings'
        ? <SettingsPage/>
        : <ChatScreen key={session} chat={chat} account={account?account.platform+' · '+account.name:null} onOpenRail={(id)=>setRail(id)}/>}
    </AppShell>
    </div>
    {toast?<div style={{position:'fixed',right:88,bottom:24,zIndex:200}}>
      <Toast tone="success" title="决策已执行" description="已进入验证阶段 · 三轮采样后收口" onDismiss={()=>setToast(false)}/>
    </div>:null}
  </>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
})();
</script></body></html>
