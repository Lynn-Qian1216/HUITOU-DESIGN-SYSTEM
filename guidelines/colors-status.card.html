<!-- @dsCard group="颜色" viewport="700x150" name="状态色组" subtitle="徽标、提示条与状态点使用的前景／背景／描边三元组" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0}body{background:var(--surface-card);width:700px;height:150px;overflow:hidden;padding:20px;display:flex;flex-direction:column;justify-content:center}.row{display:flex;gap:10px}.sw{flex:1;display:flex;flex-direction:column;gap:6px}.chip{height:46px;border-radius:var(--radius-xs);border:1px solid rgba(19,18,22,.07)}.n{font-size:11px;font-family:var(--font-mono);color:var(--text-secondary);letter-spacing:0}.h{font-size:11px;font-weight:500;letter-spacing:var(--ls-caps);text-transform:uppercase;color:var(--text-tertiary);margin:0 0 10px}</style></head><body><div style="display:flex;gap:10px"><div style="flex:1;background:var(--status-info-bg);border:1px solid var(--status-info-border);border-radius:var(--radius-sm);padding:14px 12px"><div style="display:flex;align-items:center;gap:7px"><span style="width:8px;height:8px;border-radius:999px;background:var(--status-info-fg)"></span><span style="font-size:13px;font-weight:500;color:var(--status-info-fg)">信息</span></div><div class="n" style="margin-top:8px">--status-info-*</div></div><div style="flex:1;background:var(--status-success-bg);border:1px solid var(--status-success-border);border-radius:var(--radius-sm);padding:14px 12px"><div style="display:flex;align-items:center;gap:7px"><span style="width:8px;height:8px;border-radius:999px;background:var(--status-success-fg)"></span><span style="font-size:13px;font-weight:500;color:var(--status-success-fg)">成功</span></div><div class="n" style="margin-top:8px">--status-success-*</div></div><div style="flex:1;background:var(--status-warning-bg);border:1px solid var(--status-warning-border);border-radius:var(--radius-sm);padding:14px 12px"><div style="display:flex;align-items:center;gap:7px"><span style="width:8px;height:8px;border-radius:999px;background:var(--status-warning-fg)"></span><span style="font-size:13px;font-weight:500;color:var(--status-warning-fg)">警告</span></div><div class="n" style="margin-top:8px">--status-warning-*</div></div><div style="flex:1;background:var(--status-danger-bg);border:1px solid var(--status-danger-border);border-radius:var(--radius-sm);padding:14px 12px"><div style="display:flex;align-items:center;gap:7px"><span style="width:8px;height:8px;border-radius:999px;background:var(--status-danger-fg)"></span><span style="font-size:13px;font-weight:500;color:var(--status-danger-fg)">错误</span></div><div class="n" style="margin-top:8px">--status-danger-*</div></div><div style="flex:1;background:var(--status-neutral-bg);border:1px solid var(--status-neutral-border);border-radius:var(--radius-sm);padding:14px 12px"><div style="display:flex;align-items:center;gap:7px"><span style="width:8px;height:8px;border-radius:999px;background:var(--status-neutral-fg)"></span><span style="font-size:13px;font-weight:500;color:var(--status-neutral-fg)">中性</span></div><div class="n" style="margin-top:8px">--status-neutral-*</div></div><div style="flex:1;background:var(--status-ai-bg);border:1px solid var(--status-ai-border);border-radius:var(--radius-sm);padding:14px 12px"><div style="display:flex;align-items:center;gap:7px"><span style="width:8px;height:8px;border-radius:999px;background:var(--status-ai-fg)"></span><span style="font-size:13px;font-weight:500;color:var(--status-ai-fg)">AI</span></div><div class="n" style="margin-top:8px">--status-ai-*</div></div></div></body></html>
