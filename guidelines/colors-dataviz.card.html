/div></div><div style="display:flex;gap:6px;margin-top:8px"><div style="flex:1;text-align:center" class="n">1</div><div style="flex:1;text-align:center" class="n">2</div><div style="flex:1;text-align:center" class="n">3</div><div style="flex:1;text-align:center" class="n">4</div><div style="flex:1;text-align:center" class="n">5</div><div style="flex:1;text-align:center" class="n">6</div><div style="flex:1;text-align:center" class="n">7</div></div><div class="n" style="margin-top:10px;font-family:var(--font-sans);font-size:12px;color:var(--text-tertiary)">--viz-positive <span style="color:var(--viz-positive)">▲ 12.4%</span>&nbsp;&nbsp; --viz-negative <span style="color:var(--viz-negative)">▼ 3.1%</span>&nbsp;&nbsp; --viz-grid / --viz-axis</div></body></html>
