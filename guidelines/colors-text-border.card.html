<!-- @dsCard group="颜色" viewport="700x150" name="文本与描边" subtitle="四级文本、四级描边" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0}body{background:var(--surface-card);width:700px;height:150px;overflow:hidden;padding:20px;display:flex;flex-direction:column;justify-content:center}.row{display:flex;gap:10px}.sw{flex:1;display:flex;flex-direction:column;gap:6px}.chip{height:46px;border-radius:var(--radius-xs);border:1px solid rgba(19,18,22,.07)}.n{font-size:11px;font-family:var(--font-mono);color:var(--text-secondary);letter-spacing:0}.h{font-size:11px;font-weight:500;letter-spacing:var(--ls-caps);text-transform:uppercase;color:var(--text-tertiary);margin:0 0 10px}</style></head><body><div style="display:flex;gap:32px;align-items:center"><div style="flex:1;display:flex;flex-direction:column;gap:7px"><div style="display:flex;justify-content:space-between;align-items:baseline"><span style="color:var(--text-primary);font-size:14px">主要文本</span><span class="n">--text-primary</span></div><div style="display:flex;justify-content:space-between;align-items:baseline"><span style="color:var(--text-secondary);font-size:14px">次要文本</span><span class="n">--text-secondary</span></div><div style="display:flex;justify-content:space-between;align-items:baseline"><span style="color:var(--text-tertiary);font-size:14px">第三级文本</span><span class="n">--text-tertiary</span></div><div style="display:flex;justify-content:space-between;align-items:baseline"><span style="color:var(--text-disabled);font-size:14px">禁用文本</span><span class="n">--text-disabled</span></div><div style="display:flex;justify-content:space-between;align-items:baseline"><span style="color:var(--text-link);font-size:14px">链接文本</span><span class="n">--text-link</span></div></div><div style="flex:1;display:flex;flex-direction:column;gap:11px"><div style="display:flex;align-items:center;gap:12px"><div style="flex:1;height:0;border-top:1px solid var(--border-subtle)"></div><span class="n">subtle</span></div><div style="display:flex;align-items:center;gap:12px"><div style="flex:1;height:0;border-top:1px solid var(--border-default)"></div><span class="n">default</span></div><div style="display:flex;align-items:center;gap:12px"><div style="flex:1;height:0;border-top:1px solid var(--border-strong)"></div><span class="n">strong</span></div><div style="display:flex;align-items:center;gap:12px"><div style="flex:1;height:0;border-top:1px solid var(--border-focus)"></div><span class="n">focus</span></div></div></div></body></html>
