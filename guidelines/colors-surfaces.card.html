<!-- @dsCard group="颜色" viewport="700x150" name="表面层级" subtitle="页面、卡片、下沉与反色 —— 用细线而非阴影区分" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0}body{background:var(--surface-card);width:700px;height:150px;overflow:hidden;padding:20px;display:flex;flex-direction:column;justify-content:center}.row{display:flex;gap:10px}.sw{flex:1;display:flex;flex-direction:column;gap:6px}.chip{height:46px;border-radius:var(--radius-xs);border:1px solid rgba(19,18,22,.07)}.n{font-size:11px;font-family:var(--font-mono);color:var(--text-secondary);letter-spacing:0}.h{font-size:11px;font-weight:500;letter-spacing:var(--ls-caps);text-transform:uppercase;color:var(--text-tertiary);margin:0 0 10px}</style></head><body><div class="row"><div class="sw"><div class="chip" style="background:var(--surface-page);border:1px solid var(--border-subtle);height:56px"></div><div class="n">页面</div></div><div class="sw"><div class="chip" style="background:var(--surface-card);border:1px solid var(--border-subtle);height:56px"></div><div class="n">卡片</div></div><div class="sw"><div class="chip" style="background:var(--surface-sunken);border:1px solid var(--border-subtle);height:56px"></div><div class="n">下沉</div></div><div class="sw"><div class="chip" style="background:var(--surface-hover);border:1px solid var(--border-subtle);height:56px"></div><div class="n">悬停</div></div><div class="sw"><div class="chip" style="background:var(--surface-active);border:1px solid var(--border-subtle);height:56px"></div><div class="n">按下</div></div><div class="sw"><div class="chip" style="background:var(--surface-inverse);border:1px solid var(--border-subtle);height:56px"></div><div class="n">反色</div></div></div></body></html>
