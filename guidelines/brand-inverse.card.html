<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0}body{background:var(--surface-card);width:700px;height:170px;overflow:hidden;padding:20px;display:flex;flex-direction:column;justify-content:center}.row{display:flex;gap:10px}.sw{flex:1;display:flex;flex-direction:column;gap:6px}.chip{height:46px;border-radius:var(--radius-xs);border:1px solid rgba(19,18,22,.07)}.n{font-size:11px;font-family:var(--font-mono);color:var(--text-secondary);letter-spacing:0}.h{font-size:11px;font-weight:500;letter-spacing:var(--ls-caps);text-transform:uppercase;color:var(--text-tertiary);margin:0 0 10px}</style></head><body><div style="display:flex;gap:12px;height:100%"><div style="flex:1.3;background:var(--neutral-900);border-radius:var(--radius-card);display:flex;align-items:center;justify-content:center"><img src="../assets/logo-wordmark-inverse.svg" style="height:34px" alt="HUITOU"></div><div style="flex:1;background:var(--blue-600);border:1px solid var(--border-subtle);border-radius:var(--radius-card);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;position:relative"><img src="../assets/logo-mark-inverse.svg" style="height:26px;;" alt=""><div class="n" style="color:#fff">✕ 改色</div></div><div style="flex:1;background:var(--neutral-300);border:1px solid var(--border-subtle);border-radius:var(--radius-card);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;position:relative"><img src="../assets/logo-mark.svg" style="height:26px;;opacity:.5" alt=""><div class="n" style="color:var(--text-tertiary)">✕ 对比不足</div></div><div style="flex:1;background:var(--neutral-0);border:1px solid var(--border-subtle);border-radius:var(--radius-card);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;position:relative"><img src="../assets/logo-mark.svg" style="height:26px;transform:rotate(-14deg);" alt=""><div class="n" style="color:va
