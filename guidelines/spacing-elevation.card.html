<!-- @dsCard group="间距" viewport="700x160" name="层级与阴影" subtitle="阴影几乎不可见，层级由描边承担" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0}body{background:var(--surface-card);width:700px;height:160px;overflow:hidden;padding:20px;display:flex;flex-direction:column;justify-content:center}.row{display:flex;gap:10px}.sw{flex:1;display:flex;flex-direction:column;gap:6px}.chip{height:46px;border-radius:var(--radius-xs);border:1px solid rgba(19,18,22,.07)}.n{font-size:11px;font-family:var(--font-mono);color:var(--text-secondary);letter-spacing:0}.h{font-size:11px;font-weight:500;letter-spacing:var(--ls-caps);text-transform:uppercase;color:var(--text-tertiary);margin:0 0 10px}</style></head><body><div class="row" style="padding:8px 0"><div class="sw" style="align-items:center"><div style="width:100%;height:60px;background:var(--surface-card);border:1px solid var(--border-subtle);border-radius:var(--radius-card);box-shadow:var(--shadow-xs)"></div><div class="n">xs · 静止</div></div><div class="sw" style="align-items:center"><div style="width:100%;height:60px;background:var(--surface-card);border:1px solid var(--border-subtle);border-radius:var(--radius-card);box-shadow:var(--shadow-sm)"></div><div class="n">sm · 悬停</div></div><div class="sw" style="align-items:center"><div style="width:100%;height:60px;background:var(--surface-card);border:1px solid var(--border-subtle);border-radius:var(--radius-card);box-shadow:var(--shadow-md)"></div><div class="n">md · 浮层</div></div><div class="sw" style="align-items:center"><div style="width:100%;height:60px;background:var(--surface-card);border:1px solid var(--border-subtle);border-radius:var(--radius-card);box-shadow:var(--shadow-lg)"></div><div class="n">lg · 抽屉</div></div><div class="sw" style="align-items:center"><div style="width:100%;height:60px;background:var(--surface-card);border:1px solid var(--border-subtle);border-radius:var(--radius-card);box-shadow:var(--shadow-overlay)"></div><div class="n">overlay · 弹窗</div></div></div></body></html>
