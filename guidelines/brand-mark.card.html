<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0}body{background:var(--surface-card);width:700px;height:170px;overflow:hidden;padding:20px;display:flex;flex-direction:column;justify-content:center}.row{display:flex;gap:10px}.sw{flex:1;display:flex;flex-direction:column;gap:6px}.chip{height:46px;border-radius:var(--radius-xs);border:1px solid rgba(19,18,22,.07)}.n{font-size:11px;font-family:var(--font-mono);color:var(--text-secondary);letter-spacing:0}.h{font-size:11px;font-weight:500;letter-spacing:var(--ls-caps);text-transform:uppercase;color:var(--text-tertiary);margin:0 0 10px}</style></head><body><div style="display:flex;align-items:center;gap:44px;justify-content:center;height:100%"><div style="display:flex;flex-direction:column;align-items:center;gap:10px"><div style="padding:5px;outline:1px dashed var(--border-default)"><img src="../assets/logo-mark.svg" style="height:20px;display:block" alt=""></div><div class="n">20px</div></div><div style="display:flex;flex-direction:column;align-items:center;gap:10px"><div style="padding:6px;outline:1px dashed var(--border-default)"><img src="../assets/logo-mark.svg" style="height:24px;display:block" alt=""></div><div class="n">24px</div></div><div style="display:flex;flex-direction:column;align-items:center;gap:10px"><div style="padding:8px;outline:1px dashed var(--border-default)"><img src="../assets/logo-mark.svg" style="height:32px;display:block" alt=""></div><div class="n">32px</div></div><div style="display:flex;flex-direction:column;align-items:center;gap:10px"><div style="padding:14px;outline:1px dashed var(--border-default)"><img src="../assets/logo-mark.svg" style="height:56px;display:block" alt=""></div><div class="n">56px</div></div></div></body></html>
